# ============================================================
#  Recordatorios de citas por WhatsApp — cada 5 minutos
# ============================================================
#  GitHub llama a /api/cron/recordatorios de la app publicada,
#  que manda los recordatorios cuya hora ya llegó.
#
#  ── ANTES DE QUE ESTO FUNCIONE ──────────────────────────────
#  En el repositorio: Settings → Secrets and variables → Actions
#    APP_URL      la dirección de la app, ej. https://clinicas.vercel.app
#    CRON_SECRET  el mismo valor que la variable CRON_SECRET de Vercel
#  Mientras falten, el workflow termina sin hacer nada.
#
#  GitHub no garantiza el minuto exacto: en horas de mucho uso
#  puede atrasarse unos minutos. Por eso el primer recordatorio
#  sale con horas de anticipación y no al minuto.
# ============================================================

name: Recordatorios de citas

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: recordatorios
  cancel-in-progress: false

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Llamar al envío de recordatorios
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Faltan los secretos APP_URL y CRON_SECRET; no se envía nada."
            exit 0
          fi
          curl -fsS --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/cron/recordatorios"
